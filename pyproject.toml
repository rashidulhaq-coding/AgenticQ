[project]
name = "AgenticQA"
version = "0.1.0"
description = "AgenticQA"
requires-python = ">=3.13"
dependencies = [
  "duckduckgo-search>=8.0.0",
  "ddgs>=9.0.0",
  "fastapi>=0.121.0",
  "httpx>=0.28.1",
  "langchain>=1.0.5",
  "langchain-community>=0.3.0",
  "langchain-core>=1.0.4",
  "langchain-openai>=1.0.2",
  "langgraph>=1.2.0",
  "langgraph-prebuilt>=1.1.0",
  "pydantic>=2.0.0",
  "pydantic-settings>=2.11.0",
  "python-dotenv>=1.1.0",
  "python-multipart>=0.0.20",
  "slowapi>=0.1.9",
  "sse-starlette>=2.0.0",
  "structlog>=25.5.0",
  "uvicorn>=0.34.0",
]

[project.optional-dependencies]
dev = ["black", "isort", "flake8", "ruff", "djlint==1.36.4"]

[dependency-groups]
test = ["httpx>=0.28.1", "pytest>=8.3.5"]


[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["logs*"]

[tool.pytest.ini_options]
markers = ["slow: marks tests as slow (deselect with '-m \"not slow\"')"]
python_files = ["test_*.py", "*_test.py", "tests.py"]

[tool.black]
line-length = 119
exclude = "venv|migrations"

[tool.flake8]
docstring-convention = "all"
ignore = ["D107", "D212", "E501", "W503", "W605", "D203", "D100"]
exclude = "venv|migrations"
max-line-length = 119

# radon
radon-max-cc = 10

[tool.isort]
profile = "black"
multi_line_output = "VERTICAL_HANGING_INDENT"
force_grid_wrap = 2
line_length = 119
skip = ["migrations", "venv"]

[tool.pylint."messages control"]
disable = [
    "line-too-long",
    "trailing-whitespace",
    "missing-function-docstring",
    "consider-using-f-string",
    "import-error",
    "too-few-public-methods",
    "redefined-outer-name",
]

[tool.pylint.master]
ignore = "migrations"

[tool.ruff]
line-length = 119
exclude = ["migrations", "*.ipynb", "venv"]

[tool.ruff.lint]
# Enable flake8-bugbear (`B`) rules and docstring (`D`) rules
select = ["E", "F", "B", "ERA", "D"]
# Never enforce `E501` (line length violations).
ignore = ["E501", "F401", "D203", "D213", "B904", "B008"]
# Avoid trying to fix flake8-bugbear (`B`) violations.
unfixable = ["B"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# Ignore `E402` (import violations) in all `__init__.py` files
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]

